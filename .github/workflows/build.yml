name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          if ($version -notmatch '^[0-9]+[.][0-9]+[.][0-9]+$') { throw "Invalid tag" }
          foreach ($path in @("ReaKiller/ReaKiller.csproj", "ReaKiller.Desktop/ReaKiller.Desktop.csproj", "ReaKiller.Updater/ReaKiller.Updater.csproj")) {
            $contents = Get-Content $path -Raw
            $contents = [regex]::Replace($contents, '<Version>[^<]+</Version>', "<Version>$version</Version>")
            Set-Content $path $contents
          }
          $wxs = Get-Content installer/ReaKiller.wxs -Raw
          $wxs = $wxs.Replace('Version="1.0.0"', ('Version="' + $version + '"'))
          Set-Content installer/ReaKiller.wxs $wxs
      - name: Restore
        run: dotnet restore ReaKiller/ReaKiller.csproj
      - name: Build
        run: dotnet build ReaKiller/ReaKiller.csproj -c Release --no-restore
      - name: Test
        run: dotnet test ReaKiller.Tests/ReaKiller.Tests.csproj -c Release
      - name: Publish CLI
        run: dotnet publish ReaKiller/ReaKiller.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Build desktop
        run: dotnet build ReaKiller.Desktop/ReaKiller.Desktop.csproj -c Release
      - name: Publish desktop
        run: dotnet publish ReaKiller.Desktop/ReaKiller.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o desktop
      - name: Publish updater
        run: dotnet publish ReaKiller.Updater/ReaKiller.Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o updater
      - name: Assemble bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bundle | Out-Null
          Copy-Item desktop/* bundle/ -Recurse -Force
          Copy-Item publish/* bundle/ -Recurse -Force
          Copy-Item updater/* bundle/ -Recurse -Force
      - name: Azure signing login
        if: github.event_name == 'push' && vars.ZH_ARTIFACT_SIGNING_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign executables
        if: github.event_name == 'push' && vars.ZH_ARTIFACT_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ZH_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ZH_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ZH_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\bundle
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify executable signatures
        if: github.event_name == 'push' && vars.ZH_ARTIFACT_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          foreach ($name in @("ReaKiller.exe", "ReaKiller.Desktop.exe", "ReaKiller.Updater.exe")) {
            $sig = Get-AuthenticodeSignature (Join-Path (Resolve-Path bundle).Path $name)
            if ($sig.Status -ne 'Valid') { throw "Invalid signature on $name" }
          }
      - name: Install WiX
        run: dotnet tool install --global wix --version 4.0.6
      - name: Build MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installers | Out-Null
          ./installer/Generate-Payload.ps1 -SourceDirectory bundle -OutputFile installers/Payload.wxs
          wix build -arch x64 installer/ReaKiller.wxs installers/Payload.wxs -out installers/ReaKiller-win-x64.msi
          if (!(Test-Path installers/ReaKiller-win-x64.msi)) { throw "MSI missing" }
      - name: Sign release MSI
        if: startsWith(github.ref, 'refs/tags/v') && vars.ZH_ARTIFACT_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ZH_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ZH_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ZH_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\installers
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Prepare release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ("${{ vars.ZH_ARTIFACT_SIGNING_ENABLED }}" -ne "true") { throw "Signing required for auto updates" }
          $sig = Get-AuthenticodeSignature installers/ReaKiller-win-x64.msi
          if ($sig.Status -ne 'Valid') { throw "MSI must be signed" }
          $hash = (Get-FileHash installers/ReaKiller-win-x64.msi -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content installers/ReaKiller-win-x64.msi.sha256 "$hash  ReaKiller-win-x64.msi"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME installers/ReaKiller-win-x64.msi installers/ReaKiller-win-x64.msi.sha256 --generate-notes
      - uses: actions/upload-artifact@v4
        with:
          name: ReaKiller-MSI-win-x64
          path: installers/ReaKiller-win-x64.msi
      - uses: actions/upload-artifact@v4
        with:
          name: ReaKiller-Desktop-win-x64
          path: bundle/
