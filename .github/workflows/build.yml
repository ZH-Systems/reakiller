          if ($version -notmatch '^\\d+\\.\\d+\\.\\d+
        with:
          name: ReaKiller-MSI-win-x64
          path: installers/ReaKiller-win-x64.msi
      - uses: actions/upload-artifact@v4
        with:
          name: ReaKiller-Desktop-win-x64
          path: bundle/
) { throw "Release tag must be vMajor.Minor.Patch." }
          if ("${{ vars.ZH_ARTIFACT_SIGNING_ENABLED }}" -ne "true") { throw "Enable signing before publishing an automatically installable MSI." }
          $hash = (Get-FileHash installers/ReaKiller-win-x64.msi -Algorithm SHA256).Hash.ToLowerInvariant()
