name: Windows build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ReaKiller/ReaKiller.csproj
      - name: Build
        run: dotnet build ReaKiller/ReaKiller.csproj -c Release --no-restore
      - name: Test
        run: dotnet test ReaKiller.Tests/ReaKiller.Tests.csproj -c Release
      - name: Publish
        run: dotnet publish ReaKiller/ReaKiller.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Publish desktop UI
        run: dotnet publish ReaKiller.Desktop/ReaKiller.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o desktop
      - name: Assemble desktop bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle | Out-Null
          Copy-Item desktop/* bundle/ -Recurse -Force
          Copy-Item publish/* bundle/ -Recurse -Force
      - name: Sign executables (when certificate is configured)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.ZH_CODESIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.ZH_CODESIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) {
            Write-Host "No signing certificate configured; distributing unsigned executables."
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "reakiller-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:PFX_BASE64))
            $signTool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse -ErrorAction Stop |
              Where-Object { $_.DirectoryName.EndsWith("\x64", [StringComparison]::OrdinalIgnoreCase) } |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            if (-not $signTool) { throw "Windows SDK SignTool was not found." }
            foreach ($name in @("ReaKiller.exe", "ReaKiller.Desktop.exe")) {
              $exe = Join-Path (Resolve-Path "bundle").Path $name
              if (-not (Test-Path $exe)) { throw "Executable missing: $exe" }
              & $signTool sign /f $certPath /p $env:PFX_PASSWORD /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 $exe
              if ($LASTEXITCODE -ne 0) { throw "Signing failed for $name" }
              & $signTool verify /pa /v $exe
              if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $name" }
            }
          }
          finally {
            Remove-Item $certPath -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ReaKiller-Desktop-win-x64
          path: bundle/
