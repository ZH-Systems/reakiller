name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Enforce release hold
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: throw 'Production release blocked pending security clearance; see RELEASE-READINESS.md.'
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          if ($version -notmatch '^[0-9]+[.][0-9]+[.][0-9]+$') { throw "Invalid tag" }
          foreach ($path in @("Transflux/Transflux.csproj", "Transflux.Desktop/Transflux.Desktop.csproj", "Transflux.Updater/Transflux.Updater.csproj")) {
            $contents = Get-Content $path -Raw
            $contents = [regex]::Replace($contents, '<Version>[^<]+</Version>', "<Version>$version</Version>")
            Set-Content $path $contents
          }
          $wxs = Get-Content installer/Transflux.wxs -Raw
          $wxs = $wxs.Replace('Version="1.0.0"', ('Version="' + $version + '"'))
          Set-Content installer/Transflux.wxs $wxs
      - name: Audit all project dependency graphs
        shell: pwsh
        run: |
          foreach ($project in Get-ChildItem -Recurse -Filter *.csproj) {
            dotnet restore $project.FullName -p:NuGetAudit=true -p:NuGetAuditMode=all -p:RestorePackagesWithLockFile=true
            if ($LASTEXITCODE -ne 0) { throw "Restore or security audit failed: $($project.Name)" }
          }
      - name: Capture resolved dependency graphs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dependency-audit | Out-Null
          foreach ($project in Get-ChildItem -Recurse -Filter *.csproj) {
            dotnet list $project.FullName package --include-transitive --format json | Set-Content -Encoding utf8 (Join-Path dependency-audit ($project.BaseName + '.json'))
            if ($LASTEXITCODE -ne 0) { throw 'Dependency inventory failed' }
            $lock = Join-Path $project.DirectoryName 'packages.lock.json'
            if (!(Test-Path $lock)) { throw 'Missing generated lock file' }
            Copy-Item $lock (Join-Path dependency-audit ($project.BaseName + '.lock.json'))
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: dependency-audit/
          if-no-files-found: error
      - name: Restore
        run: dotnet restore Transflux/Transflux.csproj
      - name: Build
        run: dotnet build Transflux/Transflux.csproj -c Release --no-restore
      - name: Test
        run: dotnet test Transflux.Tests/Transflux.Tests.csproj -c Release
      - name: Publish CLI
        run: dotnet publish Transflux/Transflux.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Synthetic conversion benchmark
        shell: pwsh
        run: ./scripts/Benchmark-DataConversion.ps1 -Executable ./publish/Transflux.exe -Files 10 -Rows 1000
      - name: Build desktop
        run: dotnet build Transflux.Desktop/Transflux.Desktop.csproj -c Release
      - name: Publish desktop
        run: dotnet publish Transflux.Desktop/Transflux.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o desktop
      - name: Publish updater
        run: dotnet publish Transflux.Updater/Transflux.Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o updater
      - name: Assemble bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bundle | Out-Null
          Copy-Item desktop/* bundle/ -Recurse -Force
          Copy-Item publish/* bundle/ -Recurse -Force
          Copy-Item updater/* bundle/ -Recurse -Force
          foreach ($name in @('Transflux.exe','Transflux.Desktop.exe','Transflux.Updater.exe')) {
            $file = Get-Item -LiteralPath (Join-Path bundle $name)
            if ($file.VersionInfo.ProductName -ne 'Transflux') { throw "Incorrect product identity: $name" }
          }
          if (Get-ChildItem bundle -Recurse -File | Where-Object Name -Match '(?i)reakiller|reaconverter') { throw 'Legacy artifact in bundle' }
      - name: Install WiX
        run: dotnet tool install --global wix --version 4.0.6
      - name: Build MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installers | Out-Null
          ./installer/Generate-Payload.ps1 -SourceDirectory bundle -OutputFile installers/Payload.wxs
          wix build -arch x64 installer/Transflux.wxs installers/Payload.wxs -out installers/Transflux-win-x64.msi
          if (!(Test-Path installers/Transflux-win-x64.msi)) { throw "MSI missing" }
      - name: Validate release candidate
        shell: pwsh
        run: ./scripts/Test-ReleaseCandidate.ps1 -Executable ./publish/Transflux.exe -Msi ./installers/Transflux-win-x64.msi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Transflux-MSI-win-x64
          path: installers/Transflux-win-x64.msi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Transflux-Desktop-win-x64
          path: bundle/
